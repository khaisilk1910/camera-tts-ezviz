services:
  camera-tts:
    image: "ghcr.io/khaisilk1910/camera-tts-ezviz:latest"
    hostname: "camera-tts-ezviz"
    network_mode: host

    environment:
      # ===== Chỉ các biến thường chỉnh trong Portainer =====
      PORT: "${PORT:-8124}"
      API_KEY: "${API_KEY:-change-me-now}"
      DEFAULT_CAMERA: "${DEFAULT_CAMERA:-}"
      TTS_GAIN_DB: "${TTS_GAIN_DB:-4}"
      TTS_VOICE: "${TTS_VOICE:-vi-VN-HoaiMyNeural}"
      CAMERAS_JSON: "${CAMERAS_JSON:-}"

      # ===== Cấu hình chung tối ưu sẵn =====
      TZ: "Asia/Ho_Chi_Minh"
      ALLOW_NO_AUTH: "false"
      TTS_RATE: "+0%"
      TTS_EDGE_VOLUME: "+0%"
      TTS_SAMPLE_RATE: "16000"
      TTS_BITRATE: "32k"

      QUEUE_SIZE: "30"
      MAX_TEXT: "700"
      PREP_WORKERS: "4"
      HTTP_THREADS: "8"
      SEND_TIMEOUT: "180"
      PREP_TIMEOUT: "300"
      TTS_TIMEOUT: "120"
      JOB_HISTORY: "500"

      CACHE_DIR: "/cache"
      CACHE_MAX_MB: "512"
      CACHE_TTL_DAYS: "30"

      CAMERA_DEFAULT_PORT: "8000"
      CAMERA_DEFAULT_VOICE_CHAN: "1"
      CAMERA_CONNECT_TIMEOUT_MS: "3000"
      CAMERA_RECONNECT_INTERVAL_MS: "10000"

      # Giảm thời gian mở/đóng VoiceTalk nhưng vẫn giữ biên an toàn.
      VOICE_START_DELAY_MS: "120"
      VOICE_END_DELAY_MS: "80"
      SENDER_START_TIMEOUT: "8"

      # Phát file/URL nhạc qua media_player Home Assistant.
      MEDIA_PREP_TIMEOUT: "900"
      MEDIA_SEND_TIMEOUT: "7200"

      ALLOW_REQUEST_OVERRIDES: "true"
      ALLOW_DUPLICATE_CAMERA_TARGETS: "false"

      # Tùy chọn: thêm thủ công vào Stack nếu muốn pre-cache câu cố định.
      # PRECACHE_TEXTS_JSON: '["Có người trước cổng","Có khách đến"]'

    restart: unless-stopped
    volumes:
      - camera_tts_cache:/cache
    stop_grace_period: 15s

volumes:
  camera_tts_cache:
    name: "camera-tts-ezviz-cache"

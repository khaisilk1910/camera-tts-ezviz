version: "3.8"

# Camera TTS EZVIZ - Portainer/Swarm compact stack
#
# Only settings that are normally changed are exposed as Portainer variables.
# Stable technical defaults are kept here or inside the application so the
# Environment variables screen stays short and easy to manage.

services:
  camera-tts:
    image: "ghcr.io/khaisilk1910/camera-tts-ezviz:latest"
    hostname: "camera-tts-ezviz"

    environment:
      # ---- Variables normally edited in Portainer ----
      PORT: "${PORT:-8124}"
      API_KEY: "${API_KEY:-change-me-now}"
      DEFAULT_CAMERA: "${DEFAULT_CAMERA:-}"
      TTS_GAIN_DB: "${TTS_GAIN_DB:-4}"
      TTS_VOICE: "${TTS_VOICE:-vi-VN-HoaiMyNeural}"
      CAMERAS_JSON: "${CAMERAS_JSON:-}"

      # ---- Common defaults: normally do not need to edit ----
      TZ: "Asia/Ho_Chi_Minh"
      ALLOW_NO_AUTH: "false"

      TTS_RATE: "+0%"
      TTS_EDGE_VOLUME: "+0%"
      TTS_SAMPLE_RATE: "16000"
      TTS_BITRATE: "32k"

      QUEUE_SIZE: "30"
      MAX_TEXT: "700"
      PREP_WORKERS: "4"
      HTTP_THREADS: "8"
      SEND_TIMEOUT: "180"
      PREP_TIMEOUT: "300"
      TTS_TIMEOUT: "120"
      JOB_HISTORY: "500"

      CACHE_DIR: "/cache"
      CACHE_MAX_MB: "512"
      CACHE_TTL_DAYS: "30"

      CAMERA_DEFAULT_PORT: "8000"
      CAMERA_DEFAULT_VOICE_CHAN: "1"
      CAMERA_CONNECT_TIMEOUT_MS: "3000"
      CAMERA_RECONNECT_INTERVAL_MS: "10000"

      ALLOW_REQUEST_OVERRIDES: "true"
      ALLOW_DUPLICATE_CAMERA_TARGETS: "false"

    restart: unless-stopped

    volumes:
      - camera_tts_cache:/cache

    networks:
      - host

    stop_grace_period: 15s

    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 10
        window: 60s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 20s
      rollback_config:
        parallelism: 1
        order: stop-first

volumes:
  camera_tts_cache:
    name: "camera-tts-ezviz-cache"

networks:
  host:
    external: true

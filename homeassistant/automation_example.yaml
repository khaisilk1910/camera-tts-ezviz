# Example action inside an automation/script:
- action: rest_command.camera_tts
  data:
    camera: gate
    message: "Có người đang đứng trước cổng"

# Send the same TTS to every configured camera:
- action: rest_command.camera_tts
  data:
    camera: all
    message: "Thông báo thử nghiệm toàn bộ camera"

camera_ezviz_tts:
  url: "http://192.168.31.100:8124/say"
  method: POST
  headers:
    X-API-Key: !secret camera_tts_api_key
    Content-Type: application/json
  content_type: "application/json"
  timeout: 5
  payload: >-
    {
      {% if camera | default('') | trim != '' %}
      "camera": {{ camera | trim | to_json }},
      {% endif %}
      "text": {{ message | to_json }}
    }
